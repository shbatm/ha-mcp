---
configuration:
  backup_hint:
    name: Backup hint
    description: Controls when backup reminders are shown before risky operations.
  secret_path:
    name: Secret path override
    description: |
      Optional custom HTTP path for the MCP server. Leave empty to use the auto-generated secure path. Ignored when OIDC is enabled.
  enable_skills:
    name: Enable skills
    description: >-
      Serve bundled Home Assistant best-practice skills as MCP resources.
      Skills provide automation patterns, helper selection guides, and device
      control best practices. Clients must explicitly request them.
  enable_skills_as_tools:
    name: Enable skills as tools
    description: >-
      Expose skills via list_resources/read_resource tools for MCP clients
      that don't support resources natively. Adds 3 extra tools.
  enable_tool_search:
    name: Enable tool search
    description: >-
      Replace the full tool catalog with search-based discovery. Reduces
      idle context from ~46K to ~5K tokens. Use this if using an LLM without
      deferred tools or with smaller context windows. Tools are found via
      ha_search_tools and executed via categorized proxies (read/write/delete).
      Requires restart to take effect.
  oidc_config_url:
    name: OIDC Discovery URL
    description: |
      OpenID Connect discovery URL from your identity provider (e.g., https://auth.example.com/application/o/ha-mcp/.well-known/openid-configuration). All four OIDC fields must be set to enable OIDC authentication.
  oidc_client_id:
    name: OIDC Client ID
    description: |
      OAuth client ID registered with your OIDC provider.
  oidc_client_secret:
    name: OIDC Client Secret
    description: |
      OAuth client secret from your OIDC provider.
  oidc_base_url:
    name: Public Base URL
    description: |
      The public HTTPS URL where this MCP server is accessible through your reverse proxy (e.g., https://mcp.example.com). Required for OIDC redirect flows.
  oidc_jwt_signing_key:
    name: JWT Signing Key
    description: |
      Secret key for signing session tokens. Set this to persist logins across add-on restarts. Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
